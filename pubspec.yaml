name: sela
description: "Sela — aplikasi pencarian tempat belajar untuk mahasiswa (UTS Mobile Programming)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/places.json
    - assets/images/

  # Newsreader (display/serif) dan Inter (teks/antarmuka), keduanya SIL OFL 1.1.
  # Berkas variabel dipakai apa adanya agar tidak ada unduhan font saat aplikasi dibuka.
  fonts:
    - family: Newsreader
      fonts:
        - asset: assets/fonts/Newsreader.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
